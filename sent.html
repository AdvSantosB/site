<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santos & Bezerra Advogados</title>

    <link rel="shortcut icon" href="./img/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="./css/style.min.css" rel="stylesheet">
</head>

<style>
    body {
        background-color: #ddd;
    }
    img {
        width: 100px;
        height: auto;
        text-align: center;
        margin-bottom: 30px;
    }

    h1 {
        color: green;
        margin-bottom: 30px;
    }

    p {
        color: #555;
    }

    .pagina-enviado {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .enviado-texto {
        width: 100%;
        max-width: 767px;
        text-align: center;
        border: 1px solid #bbb;
        border-radius: 12px;
        padding: 30px;
        background-color: #fff;
    }
</style>

<body>


    <div class="pagina-enviado">        
        <div class="enviado-texto">
            <img src="./img/sba.png" alt="SB Advogados">
            <h1>Sua mensagem foi enviada!</h1>
            <h3>Em breve entraremos em contato.</h3>
            <p>
                Voltando para o site automáticamente em <b>5</b>
                <br />
                ou <a href="/">Clique aqui</a>
            </p>

        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>

    <script>
        //TIME REGRESSIVO COM LINK NO FINAL
        var timeleft = 5;
         var downloadTimer = setInterval(function () {
             timeleft--;
             document.querySelector("b").textContent = timeleft;
             if (timeleft <= 0)
                 clearInterval(downloadTimer);
         }, 1000);
         window.setTimeout(function () {
             window.location.href = "/";
         }, 5000);
    </script>
</body>

</html>
